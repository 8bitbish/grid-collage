name: Browser tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fresh-fixtures:
        description: Regenerate the fixtures instead of restoring them, to check make.sh still works
        type: boolean
        default: false

jobs:
  browser:
    name: browser ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # Split four ways, each machine running its share one at a time. One job
    # running all of them took eleven minutes, nine and a half of it the tests
    # end to end. Running four side by side on one machine is as fast but not
    # as honest: swipe times its flicks against real frames, and four
    # Chromiums slow each other's frames enough to fail it. Four machines give
    # every test the machine to itself that it has always had. run.mjs does
    # the split, by how long each test takes; see durations.json.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 20
    steps:
      # The whole history, not the default single commit: test-update-path
      # installs three old builds out of it to upgrade from, and a shallow
      # clone has none of them, so it died on git archive before a browser
      # had even opened.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the suite
        working-directory: tests
        run: npm install

      # Playwright's own browser, matched to the version in tests/package.json.
      # Nothing is pinned to a build number: paths.mjs searches
      # PLAYWRIGHT_BROWSERS_PATH first and falls back to this, which is why the
      # suite runs both here and on a container with a browser preinstalled.
      # The download is cached against package.json. The system libraries it
      # needs are not in the cache and come from apt, and apt is the one step
      # here whose time is not the repository's own: --with-deps took 13 to 17
      # seconds on three machines and 132 on the fourth. The runner image ships
      # Chrome, so they are usually there already. So the browser is launched
      # before anything is installed for it, and apt is asked only if that
      # fails.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package.json') }}
      - name: Install a browser
        working-directory: tests
        run: |
          npx playwright install chromium
          launch='import("playwright").then(async ({ chromium }) => { await (await chromium.launch()).close(); })'
          if node -e "$launch"; then
            echo "chromium launches with the libraries the image already has"
          else
            echo "chromium is missing system libraries; installing them"
            npx playwright install-deps chromium
            node -e "$launch"
          fi

      # ffmpeg with lavfi, libvpx, libvorbis and libx264, for make.sh and for
      # test-rotated, which reads its export back. The runner image has none.
      #
      # Not from apt first, because apt is where the time went: 14 to 65
      # seconds on most machines, and 244 on one, which made a four-minute
      # check take seven and a half. A static build from GitHub's own release
      # storage is the same download every time from the same place. It is
      # BtbN's rolling latest rather than a pinned build, because the pinned
      # ones are deleted after a while; so it is checked for exactly what the
      # suite uses before it is trusted, and apt is still there if the
      # download or that check fails.
      - name: Install ffmpeg
        run: |
          build=ffmpeg-master-latest-linux64-gpl
          if curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz \
               "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$build.tar.xz" \
             && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp \
             && bin=/tmp/$build/bin \
             && "$bin/ffmpeg" -hide_banner -encoders | grep -q libx264 \
             && "$bin/ffmpeg" -hide_banner -encoders | grep -q 'libvpx ' \
             && "$bin/ffmpeg" -hide_banner -encoders | grep -q libvorbis \
             && "$bin/ffmpeg" -hide_banner -filters | grep -q ' color ' \
             && [ -x "$bin/ffprobe" ]; then
            echo "$bin" >> "$GITHUB_PATH"
            echo "static ffmpeg: $("$bin/ffmpeg" -version | head -1)"
          else
            echo "static ffmpeg unavailable or incomplete; falling back to apt"
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      # The fixtures only change when make.sh does, and make.sh skips any file
      # that is already there, so on a cache hit this step costs nothing. That
      # also means a warm cache never runs make.sh at all, so a manual run can
      # ask for them fresh, which is the only thing that checks it still works.
      - uses: actions/cache@v4
        if: ${{ !inputs.fresh-fixtures }}
        with:
          path: |
            tests/fixtures/photo*.jpg
            tests/fixtures/clip.mp4
            tests/fixtures/many
          key: fixtures-${{ hashFiles('tests/fixtures/make.sh') }}
      - name: Generate the fixtures too big for git
        working-directory: tests
        run: ./fixtures/make.sh

      - name: Run this shard of the suite
        working-directory: tests
        env:
          SHARD: ${{ matrix.shard }}/4
        run: node run.mjs

      # The screenshots several tests take, which are worth having when a run
      # fails on a machine nobody can open.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.shard }}
          path: tests/shots/
          if-no-files-found: ignore
