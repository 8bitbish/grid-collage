<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grid Collage — build an Instagram carousel</title>
<meta name="description" content="Build a carousel up to 20 pages. Drop photos in a tray, lay each page out as a single image or a collage, reorder, and export the lot.">
<meta name="theme-color" content="#0d0d10">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Collage">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d10'/%3E%3Cg fill='%23ff4d8d'%3E%3Crect x='6' y='6' width='8' height='8' rx='2'/%3E%3Crect x='18' y='6' width='8' height='8' rx='2'/%3E%3Crect x='6' y='18' width='8' height='8' rx='2'/%3E%3Crect x='18' y='18' width='8' height='8' rx='2' fill='%23ffb648'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="brand-name">Grid Collage</span>
  </div>
  <div class="topbar-actions">
    <button id="btn-undo" class="btn btn-ghost btn-icon" type="button" title="Undo" aria-label="Undo" disabled>&#8630;</button>
    <button id="btn-redo" class="btn btn-ghost btn-icon" type="button" title="Redo" aria-label="Redo" disabled>&#8631;</button>
    <button id="btn-install" class="btn btn-ghost" type="button" hidden>Install</button>
    <button id="btn-export" class="btn btn-primary" type="button">Export</button>
  </div>
</header>

<main class="app">

  <!-- ------------------------------------------------ pages, along the top -->
  <div class="pagesbar">
    <div class="filmstrip" id="filmstrip"></div>
  </div>

  <!-- ------------------------------------------------------------- preview -->
  <section class="stage">
    <div class="canvas-wrap" id="canvas-wrap">
      <div class="track" id="track">
        <canvas class="peek" id="canvas-prev" aria-hidden="true"></canvas>
        <canvas id="canvas" width="1080" height="1080" aria-label="Current page"></canvas>
        <canvas class="peek" id="canvas-next" aria-hidden="true"></canvas>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------ settings, at the foot -->
  <nav class="dock" id="dock" aria-label="Settings">

    <div class="dock-root" id="dock-root">
      <button class="dock-item" type="button" data-drawer="photos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M21 8v10a2 2 0 0 1-2 2H7"/><circle cx="8" cy="11" r="1.6"/><path d="M4 16l3.5-3.5L11 16"/></svg>
        <span>Photos<b class="dock-count" id="dock-photos-count"></b></span>
      </button>
      <button class="dock-item" type="button" data-drawer="layout">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
        <span>Layout</span>
      </button>
      <button class="dock-item" type="button" data-drawer="shape">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M9 7h6M9 12h6"/></svg>
        <span>Shape</span>
      </button>
      <button class="dock-item" type="button" data-drawer="gap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/></svg>
        <span>Gap</span>
      </button>
      <button class="dock-item" type="button" data-drawer="padding">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="2"/><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
        <span>Padding</span>
      </button>
      <button class="dock-item" type="button" data-drawer="corners">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20V9a6 6 0 0 1 6-6h11"/><path d="M3 20h6"/></svg>
        <span>Corners</span>
      </button>
      <button class="dock-item" type="button" data-drawer="background">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>
        <span>Background</span>
      </button>
      <button class="dock-item" type="button" data-drawer="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
        <span>Page</span>
      </button>
      <button class="dock-item" type="button" data-drawer="export">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
        <span>Export</span>
      </button>
    </div>

    <div class="dock-drawer" id="dock-drawer" hidden>
      <button class="dock-back" id="dock-back" type="button" aria-label="Back">
        <svg id="dock-back-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
        <svg id="dock-back-cross" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>

      <div class="dock-panel" id="dp-photos" hidden>
        <div class="tray" id="tray">
          <button class="tray-add" id="btn-add-photos" type="button">
            <span class="tray-add-plus">+</span>
            <span>Add photos</span>
          </button>
        </div>
      </div>

      <div class="dock-panel" id="dp-layout" hidden>
        <div class="layouts" id="layouts"></div>
      </div>

      <div class="dock-panel" id="dp-shape" hidden>
        <div class="segmented" id="ratios"></div>
      </div>

      <div class="dock-panel dock-slider" id="dp-gap" hidden>
        <label class="dock-label" for="gap">Gap between tiles <span class="val" id="gap-val">24</span></label>
        <input type="range" id="gap" min="0" max="120" step="2" value="24">
      </div>

      <div class="dock-panel dock-slider" id="dp-padding" hidden>
        <label class="dock-label" for="padding">Padding round the edge <span class="val" id="padding-val">24</span></label>
        <input type="range" id="padding" min="0" max="160" step="2" value="24">
      </div>

      <div class="dock-panel dock-slider" id="dp-corners" hidden>
        <label class="dock-label" for="radius">Corner radius <span class="val" id="radius-val">0</span></label>
        <input type="range" id="radius" min="0" max="120" step="2" value="0">
      </div>

      <div class="dock-panel" id="dp-background" hidden>
        <div class="swatches" id="swatches"></div>
        <label class="colour-row">
          <input type="color" id="bg" value="#ffffff">
          <span id="bg-hex">#FFFFFF</span>
        </label>
      </div>

      <div class="dock-panel" id="dp-page" hidden>
        <button class="btn btn-ghost btn-sm" id="btn-duplicate" type="button">Duplicate page</button>
        <button class="btn btn-ghost btn-sm btn-danger" id="btn-delete-page" type="button">Delete page</button>
      </div>

      <div class="dock-panel" id="dp-export" hidden>
        <select id="quality" class="select">
          <option value="1080">1080px (Instagram)</option>
          <option value="1440">1440px</option>
          <option value="2160">2160px</option>
        </select>
        <select id="format" class="select">
          <option value="image/jpeg">JPG</option>
          <option value="image/png">PNG</option>
        </select>
      </div>

      <!-- opens by itself when a tile is selected -->
      <div class="dock-panel dock-tile" id="dp-tile" hidden>

        <div class="tile-actions" id="tile-actions">
          <button class="dock-item" type="button" data-tile="swap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13a4 4 0 0 1 0 8H9"/><path d="M7 5L4 8l3 3"/><path d="M12 13l-3 3 3 3"/></svg>
            <span>Swap</span>
          </button>
          <button class="dock-item" type="button" data-tile="replace">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l5-5 4 4 3-2.5 4 3.5"/></svg>
            <span>Replace</span>
          </button>
          <button class="dock-item" type="button" data-tile="zoom">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3M8 11h6M11 8v6"/></svg>
            <span>Zoom</span>
          </button>
          <button class="dock-item" type="button" data-tile="rotate">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
            <span>Rotate</span>
          </button>
          <button class="dock-item" type="button" data-tile="flip">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"/><path d="M9 7L4 12l5 5z"/><path d="M15 7l5 5-5 5z"/></svg>
            <span>Flip</span>
          </button>
          <button class="dock-item" type="button" data-tile="reset">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 1 2.3 5.7"/><path d="M4 5v7h7"/></svg>
            <span>Reset</span>
          </button>
          <button class="dock-item dock-item-danger" type="button" data-tile="delete">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
            <span>Delete</span>
          </button>
        </div>

        <div class="tile-sub dock-slider" id="tile-zoom" hidden>
          <label class="dock-label" for="zoom">Zoom <span class="val" id="zoom-val">100%</span></label>
          <input type="range" id="zoom" min="100" max="800" step="1" value="100">
        </div>

        <div class="tile-sub" id="tile-rotate" hidden>
          <button class="btn btn-ghost btn-sm" id="btn-rot90" type="button">Turn 90&deg;</button>
          <div class="dock-slider">
            <label class="dock-label" for="angle">Angle <span class="val" id="cell-angle">0&deg;</span></label>
            <input type="range" id="angle" min="-180" max="180" step="1" value="0">
          </div>
        </div>

        <div class="tile-sub tile-choose" id="tile-replace" hidden>
          <div class="choose-head">
            <button class="btn btn-ghost btn-sm" id="choose-back" type="button">&larr; Back</button>
            <button class="btn btn-ghost btn-icon" id="choose-add" type="button" title="Add more photos" aria-label="Add more photos">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 14v7M14 17.5h7"/></svg>
            </button>
          </div>
          <div class="choose-strip" id="choose-strip"></div>
        </div>

        <div class="tile-sub" id="tile-flip" hidden>
          <button class="btn btn-ghost btn-sm" id="btn-flip-h" type="button">Flip across</button>
          <button class="btn btn-ghost btn-sm" id="btn-flip-v" type="button">Flip down</button>
        </div>

      </div>

    </div>
  </nav>
</main>

<input type="file" id="file-input" accept="image/*" multiple hidden>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title">Your page <span class="val" id="sheet-size"></span></h2>
      <button class="btn btn-ghost btn-sm" id="sheet-close" type="button" aria-label="Close">Close</button>
    </div>
    <img id="sheet-img" alt="Finished page">
    <p class="sheet-note">
      This page is embedded, so the browser blocks direct downloads.
      <strong>Press and hold</strong> the image (or right-click &rarr; Save image as) to keep it.
    </p>
    <div class="row">
      <button class="btn" id="sheet-copy" type="button">Copy image</button>
      <button class="btn btn-primary" id="sheet-download" type="button">Try download</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
